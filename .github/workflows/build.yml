name: build-surf

# Reconstruit le PDF toutes les heures (plage 5h-22h Paris) et le publie sur
# GitHub Pages. Rien d'allume chez toi : un serveur cloud gratuit fait le travail.
on:
  schedule:
    # Cron = UTC, ne suit pas l'heure d'ete. 03:00-20:00 UTC = 05:00-22:00 Paris
    # en ete (CEST). En hiver (CET) la plage glisse a 04:00-21:00 Paris : si ca
    # te gene, passe a '0 4-21 * * *' pendant l'hiver.
    - cron: '23 3,10,14 * * *'   # toutes les heures de 03:00 a 20:00 UTC
  workflow_dispatch: {}      # + bouton « Run workflow » / gh workflow run pour lancer a la main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04   # jammy : wkhtmltopdf s'installe via apt (retire des Ubuntu plus recents)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependances systeme (rendu HTML->PNG + tramage e-ink)
        run: sudo apt-get update && sudo apt-get install -y wkhtmltopdf xvfb python3-pil python3-numpy

      - name: Dependances Node
        run: npm install

      - name: Fetch donnees reelles + build (PDF 7 jours)
        env:
          CANDHIS_TOKEN: ${{ secrets.CANDHIS_TOKEN }}
        run: |
          node tools/fetch.mjs
          xvfb-run -a node build-week.mjs
          xvfb-run -a node build-esp32.mjs

      - name: Preparer le dossier a publier
        run: |
          mkdir -p public
          cp out/lacanau-semaine.pdf public/
          cp out/semaine.html public/index.html
          cp out/week/day-*-eink.png public/ 2>/dev/null || true
          cp out/esp32/lacanau-esp32*.bin public/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
