; Firmware surf e-ink — LilyGO T5 4.7" S3 (ESP32-S3, ecran ED047TC1 960x540)
;
; Commandes (depuis ce dossier esp32/) :
;   pio run              -> compile
;   pio run -t upload    -> compile + flashe la carte branchee en USB
;   pio device monitor   -> affiche les logs serie (Ctrl+C pour quitter)
[platformio]
default_envs = surf
boards_dir = boards

[env:surf]
platform = espressif32@6.12.0
framework = arduino
board = T5-ePaper-S3
upload_speed = 921600
monitor_speed = 115200
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLILYGO_T5_EPD47_S3
	-DCORE_DEBUG_LEVEL=0
monitor_filters =
	default
	esp32_exception_decoder
lib_deps =
	https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3
	lewisxhe/SensorLib @ 0.3.1
	lennarthennigs/Button2 @ 2.3.2
	bblanchon/ArduinoJson @ ^7.4.2
